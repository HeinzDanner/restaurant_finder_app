# =====================================================================
# Deploy-Pipeline: Frontend bauen -> Backend bauen -> Docker Hub
# (Render kommt später als Job 4 dazu)
#
# Jeder Job läuft auf einer eigenen, frischen Maschine.
# Ergebnisse werden als "Artefakt" bei GitHub abgelegt und vom
# nächsten Job wieder heruntergeladen.
#
#   build-frontend  --(Artefakt: frontend-build)-->  build-backend
#   build-backend   --(Artefakt: app-jar)-------->  push-to-docker-hub
# =====================================================================

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # -------------------------------------------------------------------
  # JOB 1: Frontend bauen
  # vite.config.ts baut direkt nach backend/src/main/resources/static
  # -------------------------------------------------------------------
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Upload Frontend-Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: backend/src/main/resources/static

  # -------------------------------------------------------------------
  # JOB 2: Backend bauen (mit Tests), Frontend kommt in static
  # Ergebnis: backend/target/restaurantFinder.jar
  # -------------------------------------------------------------------
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Clean static folder
        run: rm -rf backend/src/main/resources/static

      - name: Download Frontend-Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: backend/src/main/resources/static

      - name: Build with Maven
        run: mvn -B package --file backend/pom.xml

      - name: Upload Backend-Build
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: backend/target/restaurantFinder.jar

  # -------------------------------------------------------------------
  # JOB 3: Docker-Image bauen und zu Docker Hub pushen
  # -------------------------------------------------------------------
  push-to-docker-hub:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Backend-Build
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: backend/target

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/restaurant-finder:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/restaurant-finder:${{ github.sha }}

  # -------------------------------------------------------------------
  # JOB 4: Render sagen, dass ein neues Image bereitliegt
  # Render holt daraufhin restaurant-finder:latest von Docker Hub
  # und startet die App mit der neuen Version neu.
  # -------------------------------------------------------------------
  deploy-to-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    # Erst starten, wenn das neue Image auf Docker Hub liegt
    needs: push-to-docker-hub

    steps:
      # Deploy Hook von Render aufrufen (geheime URL aus den GitHub-Secrets).
      # --fail: Job schlägt fehl, wenn Render einen Fehler zurückgibt
      - name: Trigger Render deploy
        run: curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"