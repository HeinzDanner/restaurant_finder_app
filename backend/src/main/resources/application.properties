spring.application.name=restaurant-finder
#fehlt mongodb uri dann wird mongodb local verwendet
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/restaurantfinder}
server.port=8080
# wohin nach dem Login weitergeleitet wird
app.url=${APP_URL:http://localhost:5173}
# nötig für Render (HTTPS), sonst stimmt die Callback-URL nicht
server.forward-headers-strategy=framework